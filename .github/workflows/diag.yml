name: Diagnostic secrets (temporaire)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          ALL: ${{ toJSON(secrets) }}
          K: ${{ secrets.CAP_SIGNING_KEY }}
        run: |
          python3 -c "import json,os;print('noms:',sorted(json.loads(os.environ['ALL']).keys()));k=os.environ.get('K','');print('longueur CAP_SIGNING_KEY:',len(k),'debut ok:',k.strip().startswith('-----BEGIN PRIVATE KEY-----'))"
